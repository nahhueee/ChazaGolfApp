<p-dialog
    header="Dar de baja compra"
    [(visible)]="visible"
    (visibleChange)="visibleChange.emit($event)"
    [modal]="true"
    [style]="{ width: '440px' }"
    [closable]="true"
    [dismissableMask]="true"
>
    @if(compra){
        <p>
            Se va a dar de baja la compra <strong>{{ compra.comprobante }}</strong> por ${{ compra.total | decimalFormat }}.
            Se revertirán los movimientos que generó en Fondos
            @if(compra.metodoPago){ ({{ compra.metodoPago }}) }
            y en la cuenta corriente del proveedor. Esta acción no se puede deshacer.
        </p>

        <p-floatlabel variant="in" class="campo-motivo">
            <textarea pTextarea rows="3" maxlength="300" [(ngModel)]="motivo"></textarea>
            <label>Motivo (obligatorio)</label>
        </p-floatlabel>

        <div class="botones">
            <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="Cerrar()" />
            <p-button label="Confirmar baja" severity="danger" [disabled]="!puedeConfirmar" (onClick)="Confirmar()" />
        </div>
    }
</p-dialog>
